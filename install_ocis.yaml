- hosts: docker
  become: yes
  vars:
    service: ocis
    dir_compose: "/docker-compose/{{ service }}"
    dir_data: /ocisdata                     # общие данные (NFS) на всех узлах
    dir_conf: "{{ dir_compose }}/conf"      # конфиги oCIS: своя копия на каждом узле, управляется плейбуком
    env_file: owncloud.env                  # секреты, см. files/ocis/owncloud.env.example

    # --- версии образов: меняются только здесь ---
    ocis_version: "latest"
    collabora_version: "26.04.3.1.1"
    companion_version: "5.8.0"
    tika_version: "latest-full"
    clamav_version: "latest"

    # --- домены и адреса ---
    ocis_url: https://cloud.example.org
    oidc_issuer: https://sso.example.org/realms/home
    companion_domain: companion.example.org
    collabora_domain: collabora.example.org
    wopi_domain: wopi.example.org
    frame_ancestors: "*.example.org"
    dns_server: 1.1.1.1
    nats_address: "99.99.99.99:4222"     # внешний NATS, один на кластер

    # --- почта (пароль в owncloud.env) ---
    smtp_host: smtp.yandex.ru
    smtp_port: 465
    smtp_sender: ocis@example.org
    smtp_username: ocis@example.org

    # --- LDAP / Active Directory (пароль в owncloud.env) ---
    ldap_uri: ldaps://ad.example.org
    ldap_ca_cert: ""                        # имя файла в files/ocis/conf/, например ldap-ca.crt; "" = не проверять сертификат
    ldap_bind_dn: "CN=ocloud,OU=hm,DC=example,DC=org"
    ldap_user_base_dn: "DC=example,DC=biz"
    ldap_group_base_dn: "OU=hm,DC=example,DC=org"
    ldap_user_filter: "(&(|(objectclass=person)(objectclass=user))(|(|(memberof=CN=owncloud_client,OU=Groups,OU=hm,OU=hm,DC=example,DC=org)(primaryGroupID=2198))(|(memberof=CN=owncloud_home,OU=Groups,OU=hm,OU=hm,DC=example,DC=org)(primaryGroupID=2199))))"
    ldap_group_filter: "(&(|(objectclass=group))(|(cn=owncloud_client)(cn=owncloud_home)))"

    # --- квоты ---
    default_quota_bytes: 1073741824         # 1 ГБ: личное пространство нового пользователя
    user_role_id: d7beeea8-8ff4-406b-8fb6-ab2dd81e6b11   # встроенная роль User

    # --- firewall ---
    # Прокси на тех же хостах уже разрешён: узлы кластера и Docker-сети 172.16.0.0/12.
    # Сюда добавьте внешние прокси и vIP, если они ходят к узлам со своего адреса.
    proxies: [11.11.11.11,22.22.22.22]
    monitoring: [33.33.33.33]
    # IP узлов берутся из фактов Ansible (основной интерфейс), задавать вручную не нужно
    cluster_nodes: "{{ groups['docker'] | map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'address']) | list }}"
    proxy_ports: [9200, 9300, 9980, 3020]   # oCIS, WOPI, Collabora, Companion
    cluster_ports: [9142, 9301, 9233, 9115] # gRPC между узлами

    # --- Docker-сеть: одинаковая на всех узлах ---
    ocis_subnet: 172.28.2.96/28             # .97 шлюз, .98-.110 контейнеры
    ocis_ip: 172.28.2.102                   # адрес ocis (gRPC-шлюз :9142) в общем реестре NATS
    collaboration_ip: 172.28.2.103          # адрес collaboration (:9301) в общем реестре NATS
    ocis_dynamic_range: 172.28.2.104/29     # .104-.111: остальные контейнеры, не пересекается с фиксированными

    web_extensions: [importer, unzip, progress-bars, photo-addon, json-viewer, external-sites, advanced-search]

    docker_prune: true                      # удалять неиспользуемые образы после деплоя

  tasks:

  # ---------------------------------------------------------------- firewall
  - name: Install nftables
    apt:
      name: nftables
      state: present

  - name: Enable nftables at boot (without restart!)
    systemd:
      name: nftables
      enabled: yes

  - name: Include /etc/nftables.d at boot
    lineinfile:
      path: /etc/nftables.conf
      line: 'include "/etc/nftables.d/*.nft"'
      create: yes

  - name: Create /etc/nftables.d
    file:
      path: /etc/nftables.d
      state: directory

  - name: Render firewall rules
    template:
      src: "files/{{ service }}/{{ service }}.nft.j2"
      dest: "/etc/nftables.d/{{ service }}.nft"
      validate: "nft -c -f %s"
    register: nft_rules

  - name: Apply firewall rules
    command: "nft -f /etc/nftables.d/{{ service }}.nft"
    when: nft_rules.changed

  # ---------------------------------------------------------------- каталоги и файлы
  - name: Create directories
    file:
      path: "{{ item }}"
      state: directory
      owner: '1000'
      group: '1000'
    loop:
      - "{{ dir_compose }}"
      - "{{ dir_compose }}/tmp-node"
      - "{{ dir_compose }}/colconf"
      - "{{ dir_conf }}"
      - "{{ dir_data }}/apps"
      - "{{ dir_data }}/search/docker{{ node }}"

  - name: Render docker-compose.yaml
    template:
      src: "files/{{ service }}/{{ service }}.yaml.j2"
      dest: "{{ dir_compose }}/docker-compose.yaml"
      mode: '0644'

  - name: Copy secrets
    copy:
      src: "files/{{ service }}/{{ env_file }}"
      dest: "{{ dir_compose }}/{{ env_file }}"
      mode: '0600'

  - name: Copy oCIS config with cluster keys
    copy:
      src: "files/{{ service }}/conf/ocis.yaml"
      dest: "{{ dir_conf }}/ocis.yaml"
      owner: '1000'
      group: '1000'
      mode: '0600'

  - name: Copy oCIS configs (CSP, app registry)
    copy:
      src: "files/{{ service }}/conf/{{ item }}"
      dest: "{{ dir_conf }}/{{ item }}"
      owner: '1000'
      group: '1000'
      mode: '0644'
    loop:
      - csp.yaml
      - app-registry.yaml
      - apps.yaml

  - name: Render proxy.yaml (role quotas)
    template:
      src: "files/{{ service }}/conf/proxy.yaml.j2"
      dest: "{{ dir_conf }}/proxy.yaml"
      owner: '1000'
      group: '1000'
      mode: '0644'

  - name: Copy LDAP CA certificate
    copy:
      src: "files/{{ service }}/conf/{{ ldap_ca_cert }}"
      dest: "{{ dir_conf }}/ldap-ca.crt"
      owner: '1000'
      group: '1000'
      mode: '0644'
    when: ldap_ca_cert | length > 0

  - name: Pull images (exactly those in docker-compose.yaml)
    command: docker compose --env-file {{ env_file }} pull --quiet
    args:
      chdir: "{{ dir_compose }}"

  # ---------------------------------------------------------------- rolling restart
  - name: Restart node 1
    shell: |
      docker compose --env-file {{ env_file }} down
      docker compose --env-file {{ env_file }} up -d --remove-orphans
    args:
      chdir: "{{ dir_compose }}"
    when: node == 1

  - name: Wait for node 1
    include_tasks: files/ocis/tasks/healthcheck.yaml
    when: node == 1

  - name: Restart node 2
    shell: |
      docker compose --env-file {{ env_file }} down
      docker compose --env-file {{ env_file }} up -d --remove-orphans
    args:
      chdir: "{{ dir_compose }}"
    when: node == 2

  - name: Wait for node 2
    include_tasks: files/ocis/tasks/healthcheck.yaml
    when: node == 2

  # ---------------------------------------------------------------- очистка
  # Тома не трогаем: в clamav-db лежат антивирусные базы, в companion-data временные загрузки.
  - name: Remove unused images
    command: docker image prune -a -f
    when: docker_prune
