web:
  app_store:
    repositories:
      - url: "https://marketplace.owncloud.com/api/ocis/v1/apps.json"
        alias: "ownCloud Marketplace"
importer:
  config:
    companionUrl: https://companion.example.org
    supportedClouds:
      - WebdavPublicLink
external-sites:
  config:
    sites:
      - name: Photo
        url: "https://photo.example.org"
        target: external
        color: "#0D856F"
        icon: camera-lens
        priority: 51
      - name: Wiki
        url: "https://wiki.example.org"
        target: external
        color: "#0D856F"
        icon: booklet
        priority: 51
      - name: Profile
        url: "https://sso.example.org/profile"
        target: external
        color: "#0D856F"
        icon: profile
        priority: 49
      - name: Chat
        url: "https://chat.example.org"
        target: external
        color: "#0D856F"
        icon: chat-1
        priority: 52
